<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#af1380">
  <meta name="description" content="Maqueta navegable de Club Tambero (MVP V0): acceso, inicio, tarjeta, visitas, cupones y perfil con datos ficticios.">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Club Tambero">
  <meta name="application-name" content="Club Tambero">
  <title>Club Tambero · Maqueta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/pwa/icon-192.png">
  <link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/screens/acceso.css">
  <link rel="stylesheet" href="css/screens/inicio.css">
  <link rel="stylesheet" href="css/screens/visitas-cupones.css">
  <link rel="stylesheet" href="css/screens/perfil.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>
  <div class="stage">
    <aside class="rail" aria-label="Pantallas de la maqueta">
      <div class="rail-head">
        <img class="rail-logo" src="assets/brand/logo-negativo.svg" width="150" height="41" alt="Tambo">
        <p class="rail-title">Club Tambero</p>
        <p class="rail-sub">Maqueta navegable del MVP V0. Toca el teléfono o elige una pantalla.</p>
      </div>
      <nav class="rail-nav" id="rail-nav"></nav>
    </aside>

    <main class="device-wrap">
      <div class="device">
        <div class="app" id="app"></div>
      </div>
    </main>

    <aside class="notes" id="notes" aria-live="polite"></aside>
  </div>

  <button class="drawer-handle" id="drawer-handle" type="button" aria-label="Ver todas las pantallas"></button>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/screens/acceso.js"></script>
  <script src="js/screens/inicio.js"></script>
  <script src="js/screens/visitas-cupones.js"></script>
  <script src="js/screens/perfil.js"></script>
  <script src="js/screens/app-instalable.js"></script>
</body>
</html>
